version: "3.8"

services:
  minecraft:
    image: itzg/minecraft-server:java17
    tty: true
    stdin_open: true
    ports:
      - 25565:25565
    volumes:
      - ./data:/data

    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "1.20.2"
      OPS: "The_Mats"
      ENABLE_WHITELIST: "TRUE"
      ENFORCE_WHITELIST: "TRUE"
      EXEC_DIRECTLY: true
      INIT_MEMORY: 4G
      MAX_MEMORY: 6G
      VIEW_DISTANCE: 20
      JVM_OPTS: "--add-opens java.base/java.lang=ALL-UNNAMED"
